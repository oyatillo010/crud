{% extends 'base.html' %}

{% block content %}

<a href="{% url 'home' %}" class="inline-flex items-center gap-1 text-sky-600 hover:text-sky-700 font-medium mb-6">
    &larr; Ortga
</a>

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden max-w-3xl mx-auto">

    <img src="{{ car.img }}" alt="{{ car.name }}" class="w-full h-72 object-cover">

    <div class="p-6">

        <h1 class="text-2xl font-bold text-slate-800 mb-4">{{ car.name }}</h1>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-gray-50 rounded-lg p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wide">Yili</p>
                <p class="text-lg font-semibold text-slate-800">{{ car.year }}</p>
            </div>
            <div class="bg-gray-50 rounded-lg p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wide">Narxi</p>
                <p class="text-lg font-semibold text-slate-800">{{ car.cost }}</p>
            </div>
        </div>

        <div class="flex flex-wrap gap-3">

            <a href="" class="flex-1 min-w-[140px]">
                <button class="w-full bg-sky-500 hover:bg-sky-600 transition-colors text-white font-medium py-2.5 rounded-lg">
                    Sotib olish
                </button>
            </a>

            <a href="{% url 'home_edit' car.pk %}" class="flex-1 min-w-[140px]">
                <button class="w-full bg-amber-400 hover:bg-amber-500 transition-colors text-white font-medium py-2.5 rounded-lg">
                    Tahrirlash
                </button>
            </a>

            <a href="{% url 'home_delete' car.pk %}" class="flex-1 min-w-[140px]">
                <button class="w-full bg-red-500 hover:bg-red-600 transition-colors text-white font-medium py-2.5 rounded-lg">
                    O'chirish
                </button>
            </a>

        </div>

    </div>

</div>

{% endblock content %}
