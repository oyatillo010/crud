{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">

    <div class="text-5xl mb-4">⚠️</div>

    <p class="text-lg text-slate-800 mb-6">
        <span class="font-semibold">{{ car.name }}</span>ni o'chirishni xohlaysizmi?
    </p>

    <form action="" method="post" class="flex gap-3 justify-center">
        {% csrf_token %}

        <a href="{% url 'home' %}" class="flex-1">
            <button type="button" class="w-full bg-gray-200 hover:bg-gray-300 transition-colors text-slate-700 font-medium py-2.5 rounded-lg">
                Bekor qilish
            </button>
        </a>

        <input type="submit" value="O'chirish"
               class="flex-1 bg-red-500 hover:bg-red-600 transition-colors text-white font-medium py-2.5 rounded-lg cursor-pointer">

    </form>

</div>

{% endblock content %}
