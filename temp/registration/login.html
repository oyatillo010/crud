<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
    <div class="bg-white shadow-md rounded-2xl p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-slate-900 text-center mb-6">
            Hisobingga kir
        </h1>

        <form action="" method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors|striptags }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit"
                    class="w-full bg-sky-500 hover:bg-sky-600 transition-colors text-white font-medium py-2 rounded-lg">
                Kirish
            </button>
        </form>
    </div>
</div>
