{% extends 'base.html' %}

{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

    <h1 class="text-2xl font-bold text-slate-800 mb-6">Mahsulotni tahrirlash</h1>

    <form action="" method="post" class="space-y-4 [&_input]:w-full [&_input]:border [&_input]:border-gray-300 [&_input]:rounded-lg [&_input]:px-3 [&_input]:py-2 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-sky-400 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:text-slate-700 [&_label]:mb-1">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="submit" value="Saqlash"
               class="w-full !mt-6 bg-sky-500 hover:bg-sky-600 transition-colors text-white font-medium py-2.5 rounded-lg cursor-pointer">
    </form>

</div>

{% endblock content %}
