{% extends 'base.html' %}

{% block content %}

<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-800">Mavjud mashinalar</h1>
    <p class="text-gray-500 mt-1">Sizga yoqqan mashinani tanlang</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

    {% for car in object_list %}

    <div class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-shadow overflow-hidden border border-gray-100">

        <img src="{{ car.img }}" alt="{{ car.name }}" class="w-full h-48 object-cover">

        <div class="p-5">
            <h1 class="text-lg font-semibold text-slate-800 truncate">{{ car.name }}</h1>

            <a href="{% url 'home_detail' car.pk %}" class="block mt-4">
                <button class="w-full bg-sky-500 hover:bg-sky-600 transition-colors text-white font-medium py-2 rounded-lg">
                    Sotib olish
                </button>
            </a>
        </div>

    </div>

    {% empty %}

    <div class="col-span-full text-center py-16 text-gray-400">
        <p class="text-lg">Hozircha mahsulotlar mavjud emas.</p>
    </div>

    {% endfor %}

</div>

{% endblock content %}
