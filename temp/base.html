{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avto Do'kon</title>
    {% tailwind_css %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{% url 'home' %}" class="text-xl font-bold tracking-wide">
                🚗 Avto<span class="text-sky-400">Do'kon</span>
            </a>
    
            <div class="flex items-center gap-4">
                <a href="{% url 'home_new' %}"
                   class="bg-sky-500 hover:bg-sky-600 transition-colors text-white text-sm font-medium px-4 py-2 rounded-lg">
                    + Yangi mahsulot
                </a>
    
                {% if user.is_authenticated %}
                    <span class="text-sm text-slate-300 hidden sm:inline">
                        Xush kelibsiz, <span class="text-sky-400 font-medium">{{ user.username }}</span>
                    </span>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit"
                                class="bg-slate-700 hover:bg-red-600 transition-colors text-white text-sm font-medium px-4 py-2 rounded-lg">
                            Chiqish
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}"
                       class="bg-transparent border border-sky-400 hover:bg-sky-500 hover:border-sky-500 transition-colors text-sky-400 hover:text-white text-sm font-medium px-4 py-2 rounded-lg">
                        Kirish
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6">
        &copy; {% now "Y" %} AvtoDo'kon. Barcha huquqlar himoyalangan.
    </footer>

</body>
</html>
